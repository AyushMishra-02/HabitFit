<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | HabitFit</title>
    <meta name="description" content="Sign in to HabitFit to access your personal beginner workout plan and habit tracker.">
    <meta name="keywords" content="habitfit login, sign in, fitness tracker login">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="theme-color" content="#165536">
    <link rel="canonical" href="https://ayushmishra-02.github.io/HabitFit/login.html">
    <meta property="og:title" content="Login | HabitFit">
    <meta property="og:description" content="Sign in to your HabitFit account.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ayushmishra-02.github.io/HabitFit/login.html">
    <meta property="og:image" content="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1400&q=80">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="styles.css">
    <script>
      if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark-theme');
      }
    </script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html"><span class="brand-mark">H</span><span>HabitFit</span></a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="index.html#plan">Plan</a>
        <a href="index.html#workouts">Workouts</a>
        <a href="nutrition-for-beginners.html">Nutrition</a>
        <a href="login.html">Login</a>
        <button class="theme-toggle" aria-label="Toggle dark mode">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </nav>
      <a class="nav-action" href="index.html">Home</a>
    </header>

    <main class="login-layout">
      <section class="login-container" style="width: 100%; display: flex; justify-content: center;">
        <div class="glass-card login-card" data-reveal>
          <div class="login-header">
            <span class="brand-mark">H</span>
            <h1>Welcome Back</h1>
            <p>Sign in to continue your fitness journey</p>
          </div>
          
          <form class="login-form" action="#" method="POST">
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            
            <div class="form-actions">
              <label class="remember-me">
                <input type="checkbox" name="remember">
                <span>Remember me</span>
              </label>
              <a href="#" class="text-link forgot-password">Forgot password?</a>
            </div>
            
            <button type="submit" class="primary-button full-width">Sign In</button>
          </form>
          
          <div class="login-footer">
            <p>Don't have an account? <a href="#" class="text-link">Sign up</a></p>
          </div>
        </div>
      </section>
    </main>

    <button class="back-to-top" type="button" aria-label="Back to top">Top</button>
    <footer class="site-footer">
      <div><a class="brand" href="index.html"><span class="brand-mark">H</span><span>HabitFit</span></a><p>Beginner fitness without the noise.</p></div>
      <nav aria-label="Footer navigation"><a href="beginner-workout-plan.html">Workout Plan</a><a href="at-home-workouts.html">At-Home Workouts</a><a href="nutrition-for-beginners.html">Nutrition</a><a href="sitemap.xml">Sitemap</a></nav>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
